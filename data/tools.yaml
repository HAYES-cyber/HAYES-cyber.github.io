# Open-source security tools/scripts you actually maintain. Only list real
# repositories — link the real GitHub URL, not a placeholder.
#
# Fields:
#   name          Tool name
#   description   One-sentence description
#   repo_url      GitHub repo URL
#   language      Primary language (optional)

- name: "promptprobe"
  description: "CLI for testing LLM-backed endpoints against a categorized library of prompt-injection and jailbreak payloads (direct override, role-play jailbreaks, encoding obfuscation, indirect/tool-use injection, system-prompt exfiltration), with console/Markdown/JSON reporting."
  repo_url: "https://github.com/HAYES-cyber/promptprobe"
  language: "Python"

- name: "ctftime-collector"
  description: "PySide6 desktop tool that collects public team-ranking and event data from CTFtime.org (the aggregator behind most US/international CTFs) into a formatted Excel workbook."
  repo_url: "https://github.com/HAYES-cyber/ctftime-collector"
  language: "Python"

- name: "ctfd-console"
  description: "Local command console for CTFd-based competitions (the platform most US CTFs run on): workspace-based match management, attachment retrieval, and tool orchestration in one CLI."
  repo_url: "https://github.com/HAYES-cyber/ctfd-console"
  language: "Python"
