<footer class="site-footer">
  <div class="wrap">
    <p>
      &copy; {{ now.Year }} {{ .Site.Params.author }}
      {{ with .Site.Params.github }} · <a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
      {{ with .Site.Params.linkedin }} · <a href="{{ . }}" target="_blank" rel="noopener">LinkedIn</a>{{ end }}
      {{ with .Site.Params.hackerone }} · <a href="{{ . }}" target="_blank" rel="noopener">HackerOne</a>{{ end }}
      {{ with .Site.Params.bugcrowd }} · <a href="{{ . }}" target="_blank" rel="noopener">Bugcrowd</a>{{ end }}
      · <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
  </div>
  <script src="{{ "js/theme.js" | relURL }}"></script>
</footer>
