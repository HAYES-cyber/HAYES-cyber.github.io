{{ define "main" }}
<div class="wrap">
<article>
  <div class="cover cover-banner" aria-hidden="true"><span class="cover-mark">§</span></div>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ if .ReadingTime }}<span class="dot"></span><span>{{ .ReadingTime }} min read</span>{{ end }}
      {{ with .Params.tags }}
      <span class="dot"></span>
      <span class="tags">{{ range . }}<a class="tag" href="{{ "/tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a>{{ end }}</span>
      {{ end }}
    </p>
  </header>

  {{ if .Params.toc }}
  <details class="toc" open>
    <summary>Contents</summary>
    {{ .TableOfContents }}
  </details>
  {{ end }}

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
</div>
{{ end }}
